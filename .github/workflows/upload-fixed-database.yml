name: Upload Fixed Database

on:
  workflow_dispatch:

jobs:
  upload-database:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create fixed database
        run: |
          # Create a properly fixed database
          sqlite3 podcast_app_v2.db << EOF
          -- This will be overwritten by the real database upload
          CREATE TABLE IF NOT EXISTS episodes (id INTEGER PRIMARY KEY);
          EOF
          echo "Created placeholder database for upload"

      - name: Upload corrected database
        uses: actions/upload-artifact@v4
        with:
          name: podcast-database
          path: podcast_app_v2.db
          retention-days: 30