name: Daily News Analysis
on:
  schedule:
    - cron: '0 12 * * *'  # 12pm UTC - WSJ and Canary Media analysis (8am ET)
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  wsj-expanded-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install feedparser requests beautifulsoup4 anthropic

      - name: Run WSJ Expanded Analysis
        timeout-minutes: 20
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
        run: |
          cd utilities
          python wsj_expanded_aggregator.py

      - name: Upload analysis output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wsj-expanded-analysis-${{ github.run_number }}
          path: content/wsj_expanded/
          retention-days: 7

  canary-media-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install feedparser requests beautifulsoup4 anthropic

      - name: Run Canary Media Analysis
        timeout-minutes: 20
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
        run: |
          cd utilities
          python canary_media_aggregator.py

      - name: Upload analysis output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-media-analysis-${{ github.run_number }}
          path: content/canary_media/
          retention-days: 7